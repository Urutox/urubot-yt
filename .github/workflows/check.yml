name: YouTube zu Discord

# Gestartet alle 10 Minuten von cron-job.org (GitHubs eigener Zeitplan war zu unzuverlässig).
on:
  workflow_dispatch:
    inputs:
      test:
        description: "Testnachricht mit dem neuesten Video jedes Kanals senden"
        type: boolean
        default: false
      silent:
        description: "Still: aktuelle Videos nur merken, nichts in Discord posten"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: yt-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main   # immer den neuesten Stand holen, nie einen veralteten

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Kanäle prüfen
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          if [ "${{ inputs.test }}" = "true" ]; then
            python check.py --test
          elif [ "${{ inputs.silent }}" = "true" ]; then
            python check.py --silent
          else
            python check.py
          fi

      - name: Gesehene Videos speichern
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json 2>/dev/null || true
          git diff --staged --quiet || (git commit -m "Status aktualisiert" && (git push || (git pull --rebase && git push)))
